name: Deploy

# Push to main → SSH → git pull → build on VPS → zero-downtime switch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/hydrorage

            echo "==> syncing git"
            if [ ! -d .git ]; then
              echo "ERROR: /opt/hydrorage is not a git checkout" >&2
              exit 1
            fi
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "==> normalizing scripts (CRLF→LF) + executable"
            sed -i 's/\r$//' deploy/*.sh || true
            chmod +x deploy/*.sh

            if [ ! -f .env ]; then
              echo "ERROR: missing /opt/hydrorage/.env — copy from .env.prod.example" >&2
              exit 1
            fi

            if [ ! -f ACTIVE_COLOR ]; then
              echo "==> first boot → bootstrap.sh"
              bash deploy/bootstrap.sh local
            else
              echo "==> deploy → zero-downtime.sh (active=$(cat ACTIVE_COLOR))"
              bash deploy/zero-downtime.sh local
            fi

            echo "==> host nginx vhost (hydrorage only)"
            if sudo -n true 2>/dev/null; then
              bash deploy/install-host-nginx.sh
            else
              echo "WARN: passwordless sudo yok. Sunucuda bir kez çalıştır:"
              echo "      sudo bash /opt/hydrorage/deploy/install-host-nginx.sh"
            fi

            echo "==> done"
