name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/hydrorage

            echo "==> syncing git"
            test -d .git || { echo "ERROR: not a git checkout"; exit 1; }
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "==> normalizing deploy/*.sh"
            for f in deploy/*.sh; do
              [ -f "$f" ] || continue
              sed -i 's/\r$//' "$f" || true
              chmod +x "$f" || true
              echo "    $f"
            done

            echo "==> checking .env"
            test -f .env || { echo "ERROR: missing .env"; exit 1; }

            if [ ! -f ACTIVE_COLOR ]; then
              echo "==> bootstrap"
              bash deploy/bootstrap.sh local
            else
              echo "==> zero-downtime (active=$(cat ACTIVE_COLOR | tr -d '\r'))"
              bash deploy/zero-downtime.sh local
            fi

            echo "==> wire into ttengamesstudio-nginx edge"
            bash deploy/install-into-edge-nginx.sh || echo "WARN: edge wire failed — run manually"

            echo "==> done"
