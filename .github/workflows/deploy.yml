name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          # Do NOT use script_stop — it breaks if/test false branches (exit 1).
          script: |
            set -euo pipefail
            cd /opt/hydrorage
            echo "==> syncing git"
            test -d .git || { echo "ERROR: not a git checkout"; exit 1; }
            git fetch --depth=1 origin main
            git reset --hard origin/main
            sed -i 's/\r$//' deploy/gha-remote.sh || true
            chmod +x deploy/gha-remote.sh || true
            bash deploy/gha-remote.sh
