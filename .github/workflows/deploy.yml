name: Deploy

# Push to main → SSH → git pull → build on VPS → zero-downtime switch.
# No GHCR login required (repo public is enough for git clone/fetch).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/hydrorage
            if [ -d .git ]; then
              git fetch --depth=1 origin main
              git reset --hard origin/main
            else
              echo "ERROR: /opt/hydrorage is not a git checkout" >&2
              exit 1
            fi
            chmod +x deploy/*.sh
            if [ ! -f ACTIVE_COLOR ]; then
              ./deploy/bootstrap.sh local
            else
              ./deploy/zero-downtime.sh local
            fi
            # Ensure host routes hydrorage.* (does not touch other sites)
            if [ -x deploy/install-host-nginx.sh ]; then
              sudo -n ./deploy/install-host-nginx.sh \
                || echo "WARN: run once on server: sudo ./deploy/install-host-nginx.sh"
            fi
