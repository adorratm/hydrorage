# Host nginx vhost — ONLY HydroRage hostnames.
# Does not replace or modify ttengamesstudio / emrekilic / kiliccoffeeroaster sites.
#
# Install (once):
#   sudo ./deploy/install-host-nginx.sh
#
# Upstream: docker compose nginx on 127.0.0.1:9080 (see HTTP_BIND in .env)

upstream hydrorage_docker {
  server 127.0.0.1:9080;
  keepalive 8;
}

# --- HTTP (Cloudflare Flexible or certbot challenge) ---
server {
  listen 80;
  listen [::]:80;
  server_name hydrorage.com.tr www.hydrorage.com.tr
               admin.hydrorage.com.tr
               api.hydrorage.com.tr;

  location / {
    proxy_pass http://hydrorage_docker;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}

