# Host nginx — ONLY HydroRage hostnames.
# Does not modify ttengamesstudio / emrekilic / kiliccoffeeroaster vhosts.
#
# Install: sudo ./deploy/install-host-nginx.sh
# Upstream: docker edge on 127.0.0.1:9080

upstream hydrorage_docker {
  server 127.0.0.1:9080;
  keepalive 8;
}

# HTTP (Cloudflare Flexible, or redirect path)
server {
  listen 80;
  listen [::]:80;
  server_name hydrorage.com.tr www.hydrorage.com.tr
               admin.hydrorage.com.tr
               api.hydrorage.com.tr;

  location / {
    proxy_pass http://hydrorage_docker;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}

# HTTPS — needed when Cloudflare SSL mode is Full / Full (strict).
# Without this block, SNI hydrorage.com.tr falls through to the DEFAULT
# SSL site (often ttengamesstudio.com.tr).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name hydrorage.com.tr www.hydrorage.com.tr
               admin.hydrorage.com.tr
               api.hydrorage.com.tr;

  ssl_certificate     /etc/nginx/ssl/hydrorage/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/hydrorage/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://hydrorage_docker;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
