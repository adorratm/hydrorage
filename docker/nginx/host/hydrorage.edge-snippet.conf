# Snippet for ttengamesstudio-nginx (owns host :80/:443).
# Prefer container DNS after: docker network connect <tten-net> hydrorage-nginx-1
# Fallback 172.17.0.1:9080 only works if HTTP_BIND=0.0.0.0:9080 (not loopback).

upstream hydrorage_edge {
  server hydrorage-nginx-1:80;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name hydrorage.com.tr www.hydrorage.com.tr
               admin.hydrorage.com.tr
               api.hydrorage.com.tr;

  location / {
    proxy_pass http://hydrorage_edge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name hydrorage.com.tr www.hydrorage.com.tr
               admin.hydrorage.com.tr
               api.hydrorage.com.tr;

  ssl_certificate     /etc/nginx/conf.d/hydrorage.fullchain.pem;
  ssl_certificate_key /etc/nginx/conf.d/hydrorage.privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://hydrorage_edge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
