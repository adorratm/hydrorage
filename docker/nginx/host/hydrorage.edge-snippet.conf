# Snippet for ttengamesstudio-nginx (owns host :80/:443).
# Proxies HydroRage hostnames to the hydrorage docker edge on the host.
#
# Install: sudo bash deploy/install-into-edge-nginx.sh

upstream hydrorage_edge {
  # Docker bridge → host 127.0.0.1:9080 (hydrorage-nginx)
  server 172.17.0.1:9080;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name hydrorage.com.tr www.hydrorage.com.tr
               admin.hydrorage.com.tr
               api.hydrorage.com.tr;

  location / {
    proxy_pass http://hydrorage_edge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name hydrorage.com.tr www.hydrorage.com.tr
               admin.hydrorage.com.tr
               api.hydrorage.com.tr;

  # Reuse TTEN cert paths if present; else self-signed created by install script
  ssl_certificate     /etc/nginx/ssl/hydrorage/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/hydrorage/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://hydrorage_edge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
