[databases]
hydrorage = host=postgres port=5432 user=hydrorage password=hydrorage

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
ignore_startup_parameters = extra_float_digits
admin_users = hydrorage
server_tls_sslmode = disable
