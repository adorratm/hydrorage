services:
  postgres:
    image: postgres:18-alpine
    container_name: hydrorage-postgres
    environment:
      POSTGRES_USER: hydrorage
      POSTGRES_PASSWORD: hydrorage
      POSTGRES_DB: hydrorage
    ports:
      - "5434:5432"
    # PG 18+: mount parent dir (data lives in /var/lib/postgresql/18/docker)
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrorage -d hydrorage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hydrorage

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: hydrorage-pgbouncer
    # Custom ini: image entrypoint always injects auth_user and breaks PG18 SCRAM.
    entrypoint: ["/usr/bin/pgbouncer"]
    command: ["/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hydrorage

  redis:
    image: redis:7-alpine
    container_name: hydrorage-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hydrorage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hydrorage-api
    env_file:
      - apps/api/.env.docker
    command:
      [
        "sh",
        "-c",
        "yarn db:migrate && yarn db:seed && node dist/main.js",
      ]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hydrorage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  postgres_data:
  redis_data:

networks:
  hydrorage:
    name: hydrorage
