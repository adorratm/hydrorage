services:
  postgres:
    image: postgres:16-alpine
    container_name: hydrorage-postgres
    environment:
      POSTGRES_USER: hydrorage
      POSTGRES_PASSWORD: hydrorage
      POSTGRES_DB: hydrorage
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrorage -d hydrorage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hydrorage

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: hydrorage-pgbouncer
    environment:
      DATABASE_URL: postgres://hydrorage:hydrorage@postgres:5432/hydrorage
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: hydrorage
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hydrorage

  redis:
    image: redis:7-alpine
    container_name: hydrorage-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hydrorage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hydrorage-api
    env_file:
      - apps/api/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hydrorage

volumes:
  postgres_data:
  redis_data:

networks:
  hydrorage:
    name: hydrorage
